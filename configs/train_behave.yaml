manifest: data/processed/behave_with_body_fk.jsonl
output: runs/behave_body_fk_seed42
body_geometry_version: 1
geometry_objective_version: 2
seed: 42
device: cuda:0
cpu_threads: 4
workers: 0
window: 120
stride: 60
batch_size: 8
balance_datasets: true
max_steps: 200000
learning_rate: 0.0001
weight_decay: 0.01
gradient_clip: 1.0
ema_decay: 0.999
diffusion_steps: 1000
geometry_weight: 0.05
losses:
  denoise_human: true
  denoise_object: true
  denoise_contact: true
  contact: true
  noncontact: true
  fk: true
  floor: false
  slip: true
# Toggle text input for both training and validation.
# Both settings use the same temporally aligned HOI-Diff clips and split assignments.
text_condition: true
text_dropout: 0.1
log_every: 20
save_every: 1000
validate_every: 1000
validation_batches: 20
save_best: true
progress: true
use_swanlab: true
swanlab_project: HOI
swanlab_run_name: null
swanlab_workspace: null
swanlab_mode: online
holdout_signatures: []
# Optional TriDi-style mode whitelist (H/O/C, 1=generate, 0=condition).
# Omit to train on all seven full modes plus sparse patterns.
# allowed_patterns: ["011", "101", "111"]
model:
  relation_geometry: fk
  geometry_encoder: mesh_bps
  width: 192
  heads: 6
  layers: 4
  dropout: 0.1
  text_dim: 512
  relations: true
  two_stage: true
