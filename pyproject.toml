[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-controllable-hoi"
version = "0.1.0"
description = "Token-autoregressive human-object-contact generation with composable observed constraints"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
body = ["smplx>=0.1.28"]
swanlab = ["swanlab>=0.6"]
token-ar = ["transformers>=5.19,<6", "accelerate>=1.15,<2", "safetensors>=0.4"]

[project.scripts]
hoi-token-train-vq = "unified_hoi.token_ar.train_codecs:main"
hoi-token-evaluate-vq = "unified_hoi.token_ar.evaluate_codecs:main"
hoi-token-train = "unified_hoi.token_ar.train:main"
hoi-token-sample = "unified_hoi.token_ar.sample:main"
hoi-token-evaluate = "unified_hoi.token_ar.evaluate:main"
hoi-token-benchmark = "unified_hoi.token_ar.benchmark:main"
hoi-token-cache-refinement = "unified_hoi.token_ar.prepare_refinement:main"
hoi-token-train-refiner = "unified_hoi.token_ar.train_refiner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
