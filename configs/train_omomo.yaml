# Dataset-isolated native body parameters + independently trained 128-D contact latent.
representation: parametric_v1
dataset: omomo
manifest: data/processed/omomo_parametric.jsonl
output: runs/omomo_parametric_seed42
contact_support: data/parametric_assets/omomo/contact_support.npz
contact_codec: data/parametric_assets/omomo/contact_ae/best.pt
body_models: data/smplx_models
seed: 42
device: cuda:0
cpu_threads: 4
workers: 0
window: 120
stride: 60
batch_size: 8
balance_datasets: false
max_steps: 200000
learning_rate: 0.0001
weight_decay: 0.01
gradient_clip: 1.0
ema_decay: 0.999
diffusion_steps: 1000
timestep_sampling: shared
geometry_weight: 1.0
geometry_max_t: 250
geometry_frames: 16
geometry_losses:
  object_v2v: 10.0
  body_v2v: 1.0
  surface_distance: 5.0
text_condition: true
text_dropout: 0.1
log_every: 20
save_every: 1000
validate_every: 1000
validation_batches: 8
validation_steps: 50
validation_fps: 1.0
validation_text_condition: false
best_mode: '010'
use_swanlab: true
swanlab_project: HOI
swanlab_run_name: omomo_parametric
swanlab_mode: online
allowed_patterns:
- '100'
- '010'
- '001'
- '110'
- '101'
- '011'
- '111'
model:
  dataset: omomo
  width: 192
  heads: 6
  layers: 4
  dropout: 0.1
  text_dim: 512
  relations: true
  two_stage: true
