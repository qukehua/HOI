architecture: token_ar_v1
dataset: behave
manifest: data/processed/behave_parametric.jsonl
contact_support: data/parametric_assets/behave/contact_support.npz
seed: 42
cpu_threads: 4
window: 120
stride: 60
output: runs/token_ar/behave/qwen35_4b_tasks3_fid
# Canonical 512x512 VQ selected by the lowest validation joint FID. A changed codebook cannot resume an old AR run.
codecs: runs/token_ar/behave/vq_canonical_100k_fid/best.pt
backbone: Qwen/Qwen3.5-4B-Base
load_dtype: float32
train_scope: full
gradient_checkpointing: true
mixed_precision: bf16
batch_size: 1
gradient_accumulation_steps: 8
max_steps: 50000
learning_rate: 2.0e-05
weight_decay: 0.01
gradient_clip: 1.0
geometry_tokens: 8
max_text_tokens: 128
max_sequence_tokens: 512
# 111 text-to-HOI, 101 object-to-human, 011 human-to-object.
allowed_modes:
- '111'
- '101'
- '011'
# Dropout applies only to object-to-human, so that task sees both text settings.
text_dropout: 0.5
validate_every: 1000
validation_batches: 8
validation_text_condition: true
log_every: 20
selection_metric: fid
fid_view: joint
motion_text_evaluator: runs/token_ar/behave/motion_text_evaluator/last.pt
backbone_revision: 1001bb4d826a52d1f399e183466143f4da7b741b
attention_backend: sdpa
sync_each_batch: true
use_swanlab: true
swanlab_project: HOI
swanlab_mode: online
