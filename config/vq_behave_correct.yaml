architecture: token_ar_v1
dataset: behave
manifest: data/processed/behave_correct.jsonl
contact_support: data/parametric_assets/behave/contact_support.npz
seed: 42
cpu_threads: 4
window: 120
stride: 60
output: runs/token_ar/behave/vq_correct
device: cuda:0
gpus: 4
batch_size: 2048
max_steps: 1500000
modality_steps:
  human: 1500000
  object: 1000000
  contact: 1000000
learning_rate: 0.0002
# best.pt is the lowest validation geometry score: joint cm + object translation cm
# + object rotation deg + 100 * (1 - contact F1). No text evaluator.
select_by_geometry: true
validate_every: 1000
validation_batches: 16
log_every: 20
use_swanlab: true
swanlab_project: HOI
swanlab_run_name: behave_vq_correct
swanlab_mode: online
codec:
  canonical_scene: true
  codebook_size: 512
  latent_dim: 4096
  width: 512
  network: residual
  quantizer: ema
  depth: 3
  dilation_growth: 3
  ema_decay: 0.99
  ema_reset_threshold: 1.0
  stride: 2
  commitment_weight: 0.25
  velocity_weight: 0.1
