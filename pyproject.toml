[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-controllable-hoi"
version = "0.1.0"
description = "Temporal human-object-contact diffusion with composable observed constraints"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "trimesh>=4", "joblib>=1.3", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
body = ["smplx>=0.1.28"]
text = ["transformers>=4.40", "safetensors>=0.4"]
wandb = ["wandb>=0.17"]

[project.scripts]
hoi-train = "unified_hoi.train:main"
hoi-sample = "unified_hoi.sample:main"
hoi-evaluate = "unified_hoi.evaluate:main"
hoi-preprocess = "unified_hoi.preprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"unified_hoi.integrations" = ["licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
