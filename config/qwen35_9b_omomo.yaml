architecture: token_ar_v1
dataset: omomo
manifest: data/processed/omomo_parametric.jsonl
contact_support: data/parametric_assets/omomo/contact_support.npz
seed: 42
cpu_threads: 4
window: 120
stride: 60
output: runs/token_ar/omomo/qwen35_9b_tasks3
codecs: runs/token_ar/omomo/vq_residual_ema_512x4096/last.pt
# Local snapshot of Qwen/Qwen3.5-9B-Base @ 68c46c4b3498877f3ef123c856ecfde50c39f404.
# Official Qwen3.5 has no 8B checkpoint. 9B-Base is the next dense base for the size ablation.
backbone: data/pretrained/Qwen3.5-9B-Base
load_dtype: float32
train_scope: full
gradient_checkpointing: true
mixed_precision: bf16
batch_size: 1
gradient_accumulation_steps: 8
max_steps: 50000
learning_rate: 2.0e-05
weight_decay: 0.01
gradient_clip: 1.0
geometry_tokens: 8
max_text_tokens: 128
max_sequence_tokens: 512
# 111 text-to-HOI, 101 object-to-human, 011 human-to-object.
allowed_modes:
- '111'
- '101'
- '011'
# Dropout applies only to object-to-human, so that task sees both text settings.
text_dropout: 0.5
validate_every: 1000
validation_batches: 8
validation_text_condition: true
log_every: 20
attention_backend: sdpa
sync_each_batch: true
