architecture: token_ar_v1
dataset: omomo
manifest: data/processed/omomo_parametric.jsonl
contact_support: data/parametric_assets/omomo/contact_support.npz
seed: 42
cpu_threads: 4
window: 120
stride: 60
output: runs/token_ar/omomo/qwen3_4b_full_vq_ema
codecs: runs/token_ar/omomo/vq_residual_ema_512x4096/last.pt
backbone: Qwen/Qwen3-4B
load_dtype: float32
train_scope: full
last_layers: 4
gradient_checkpointing: true
mixed_precision: bf16
batch_size: 1
gradient_accumulation_steps: 8
max_steps: 50000
learning_rate: 2.0e-05
weight_decay: 0.01
gradient_clip: 1.0
geometry_tokens: 8
max_text_tokens: 128
max_sequence_tokens: 512
allowed_modes:
- '100'
- '010'
- '001'
- '110'
- '101'
- '011'
- '111'
text_dropout: 0.1
validate_every: 1000
validation_batches: 8
validation_text_condition: true
log_every: 20
